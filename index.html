    <script>
      // Automated PWA Stale Cache & Script Error Auto-Recovery
      window.addEventListener('error', function (e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('[PWA Error] Falha ao carregar recurso do aplicativo. Limpando cache e recarregando...', e.target.src);
          if ('caches' in window) {
            caches.keys().then(function (names) {
              for (let name of names) caches.delete(name);
            }).then(function () {
              window.location.reload(true);
            });
          } else {
            window.location.reload(true);
          }
        }
      }, true);
    </script>
  </head>
  <body class="bg-[#F8F9FA] text-slate-900 antialiased">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F8F9FA; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; padding: 24px; text-align: center;">
        <div style="width: 60px; height: 60px; border-radius: 20px; background: linear-gradient(135deg, #147A80, #4BBCBE); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 12px 30px -5px rgba(20, 122, 128, 0.35);">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

          </svg>
        </div>
        <h2 style="font-size: 20px; font-weight: 800; color: #0F172A; margin: 0 0 6px 0; letter-spacing: -0.02em;">Bertuol Odontologia</h2>
        <p style="font-size: 13px; color: #64748B; margin: 0 0 20px 0; max-width: 340px; line-height: 1.5;">
          Carregando interface do aplicativo...
        </p>
        <button onclick="if('caches' in window){caches.keys().then(function(n){for(let x of n)caches.delete(x);}).then(function(){if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){for(let s of r)s.unregister();});}window.location.reload(true);});}else{window.location.reload(true);}" style="padding: 10px 22px; background-color: #147A80; color: #ffffff; border: none; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(20, 122, 128, 0.25);">
          Recarregar Aplicativo
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
