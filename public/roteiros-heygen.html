  <style>
    :root {
      --bg-base: #070E17;
      --bg-surface: #0E1A29;
      --bg-elevated: #15253A;
      --border-subtle: rgba(56, 189, 248, 0.16);
      --teal: #1FB5BD;
      --teal-dark: #147A80;
      --gold: #FFCC29;
      --emerald: #10B981;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.55;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(7, 14, 23, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .badge-version {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      background: rgba(255, 204, 41, 0.12);
      border: 1px solid rgba(255, 204, 41, 0.35);
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .header-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header-sub {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--bg-elevated);
      border: 1px solid rgba(148, 163, 184, 0.24);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
    }

    .btn:hover {
      border-color: var(--teal);
      background: rgba(31, 181, 189, 0.16);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--teal-dark) 0%, var(--teal) 100%);
      border-color: #5EEAD4;
      color: #FFFFFF;
    }

    .btn-gold {
      background: rgba(255, 204, 41, 0.15);
      border-color: rgba(255, 204, 41, 0.45);
      color: var(--gold);
    }

    .btn-gold:hover {
      background: rgba(255, 204, 41, 0.28);
    }

    /* Container */
    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* Tabs */
    .tabs-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }

    .tab-btn {
      background: var(--bg-surface);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: var(--text-secondary);
      padding: 14px 16px;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tab-btn:hover {
      border-color: rgba(31, 181, 189, 0.45);
      color: var(--text-primary);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(20, 122, 128, 0.35) 0%, rgba(14, 26, 41, 0.95) 100%);
      border-color: var(--teal);
      color: #FFFFFF;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .tab-label {
      font-size: 13.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tab-desc {
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    /* Video Banner */
    .video-hero {
      background: linear-gradient(135deg, #0E2235 0%, #091522 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .video-hero h2 {
      font-size: 19px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 4px;
    }

    .video-hero p {
      font-size: 13px;
      color: var(--text-secondary);
      max-width: 720px;
    }

    /* Scene Grid */
    .scenes-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .scene-card {
      background: var(--bg-surface);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .scene-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .scene-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .scene-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      background: rgba(31, 181, 189, 0.18);
      color: #5EEAD4;
      border: 1px solid rgba(31, 181, 189, 0.4);
      padding: 3px 9px;
      border-radius: 6px;
    }

    .scene-name {
      font-size: 15px;
      font-weight: 800;
      color: #FFFFFF;
    }

    .scene-duration {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--gold);
      background: rgba(255, 204, 41, 0.1);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .scene-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    .meta-box {
      background: rgba(7, 14, 23, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .meta-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #38BDF8;
      margin-bottom: 4px;
      display: block;
    }

    .meta-text {
      font-size: 12.5px;
      color: #E2E8F0;
    }

    .voiceover-box {
      background: rgba(20, 122, 128, 0.12);
      border: 1px solid rgba(45, 212, 191, 0.32);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .voiceover-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .voiceover-text {
      font-size: 14.5px;
      font-weight: 600;
      color: #FFFFFF;
      line-height: 1.6;
    }

    .veo-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px dashed rgba(148, 163, 184, 0.25);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .veo-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: #94A3B8;
      flex: 1;
      min-width: 240px;
    }

    /* Table for Technical Mapping */
    .table-wrapper {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 12.5px;
    }

    th {
      background: #0B1522;
      color: #38BDF8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
    }

    td {
      padding: 13px 16px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      color: #E2E8F0;
      vertical-align: top;
    }

    tr:hover td {
      background: rgba(31, 181, 189, 0.05);
    }

    .code-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #5EEAD4;
      background: rgba(31, 181, 189, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 2px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      background: #10B981;
      color: #052E16;
      font-weight: 800;
      font-size: 13px;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.45);
      transform: translateY(120%);
      opacity: 0;
      transition: all 0.25s ease;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    function copyText(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('✅ ' + label + ' copiado!');
      });
    }

    function buildFullHeyGenPrompt(videoKey) {
      const v = SCRIPTS[videoKey];
      let out = `Crie um vídeo de treinamento e apresentação elegante de 2 minutos (6 cenas) em Português do Brasil (pt-BR) para o sistema "Bertuol Flow" da "Bertuol Odontologia" (${v.title}).\n\n`;
      out += `DIRETRIZES VISUAIS:\n- Cores da marca: Turquesa (#147A80), Ciano (#1FB5BD) e Dourado (#FFCC29).\n- Velocidade da voz: 0.95x, tom caloroso, confiante e natural.\n\n`;
      v.scenes.forEach(s => {
        out += `[${s.num} - ${s.duration} - ${s.title}]\n`;
        out += `Enquadramento Avatar: ${s.framing}\n`;
        out += `Fundo / Tela: ${s.capture}\n`;
        out += `Narração (Fala Exata): "${s.voiceover}"\n\n`;
      });
      return out;
    }

    function renderVideoTab(videoKey) {
      const v = SCRIPTS[videoKey];
      const container = document.getElementById('content-area');

      let html = `
        <div class="video-hero">
          <div>
            <h2>${v.title}</h2>
            <p>${v.subtitle}</p>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <a href="${v.openUrl}" target="_blank" class="btn">${v.openLabel}</a>
            <button class="btn btn-primary" onclick="copyFullPrompt('${videoKey}')">
              📋 Copiar Prompt Completo das 6 Cenas (HeyGen)
            </button>
          </div>
        </div>
        <div class="scenes-list">
      `;

      v.scenes.forEach((s, idx) => {
        html += `
          <div class="scene-card">
            <div class="scene-header">
              <div class="scene-title-group">
                <span class="scene-num">${s.num}</span>
                <span class="scene-name">${s.title}</span>
              </div>
              <span class="scene-duration">${s.duration}</span>
            </div>

            <div class="scene-meta-grid">
              <div class="meta-box">
                <span class="meta-label">🖥️ 1. Tela Exata a Capturar & LGPD</span>
                <div class="meta-text">${s.capture}</div>
              </div>
              <div class="meta-box">
                <span class="meta-label">👤 2. Enquadramento Ideal no HeyGen</span>
                <div class="meta-text">${s.framing}</div>
              </div>
            </div>

            <div class="voiceover-box">
              <div class="voiceover-header">
                <span class="meta-label" style="margin:0; color:#5EEAD4;">🎙️ 3. Texto da Narração (Fala para colar na Cena do HeyGen)</span>
                <button class="btn" onclick="copySceneVoice('${videoKey}', ${idx})">📋 Copiar Fala da ${s.num}</button>
              </div>
              <div class="voiceover-text">"${s.voiceover}"</div>
            </div>

            <div class="veo-box">
              <div class="veo-text">
                <strong style="color:#38BDF8;">🎬 4. Prompt B-Roll (Google Flow / Veo):</strong> ${s.veo}
              </div>
              <button class="btn" onclick="copySceneVeo('${videoKey}', ${idx})">🎥 Copiar Prompt Veo</button>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
    }

    function renderMapTab() {
      const container = document.getElementById('content-area');
      let html = `
        <div class="video-hero">
          <div>
            <h2>SAÍDA 1: Mapeamento Técnico Real das Funcionalidades (16 Módulos)</h2>
            <p>Auditoria direta do código-fonte (src/App.tsx, src/patient/*, src/components/* e server.ts). Nenhum recurso fictício incluído.</p>
          </div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>1. Nome do Módulo / Tela (UI)</th>
                <th>2. Rota / Arquivo Principal</th>
                <th>3. Ação Real Executada pelo Usuário</th>
                <th>4. Impacto Operacional</th>
              </tr>
            </thead>
            <tbody>
      `;

      TECH_MODULES.forEach(row => {
        html += `
          <tr>
            <td style="font-weight:800; color:#FFFFFF;">${row[0]}</td>
            <td><span class="code-tag">${row[1]}</span></td>
            <td>${row[2]}</td>
            <td style="color:#A7F3D0;">${row[3]}</td>
          </tr>
        `;
      });

      html += `</tbody></table></div>`;
      container.innerHTML = html;
    }

    window.copyFullPrompt = function(videoKey) {
      copyText(buildFullHeyGenPrompt(videoKey), 'Prompt Completo (' + SCRIPTS[videoKey].title.split(':')[0] + ')');
    };

    window.copySceneVoice = function(videoKey, idx) {
      const s = SCRIPTS[videoKey].scenes[idx];
      copyText(s.voiceover, 'Fala da ' + s.num);
    };

    window.copySceneVeo = function(videoKey, idx) {
      const s = SCRIPTS[videoKey].scenes[idx];
      copyText(s.veo, 'Prompt Veo da ' + s.num);
    };

    window.selectTab = function(key, btnEl) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      if (key === 'map') {
        renderMapTab();
      } else {
        renderVideoTab(key);
      }
    };

    // Initial render
    renderVideoTab('v1');
  </script>
