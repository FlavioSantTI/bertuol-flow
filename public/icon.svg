<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF981A"/>
    </linearGradient>
    <linearGradient id="tooth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6"/>

  <!-- Dental Icon / Stethoscope Motif in Safe Zone -->
  <g filter="url(#shadow)">
    <!-- Tooth Silhouette -->
    <path d="M 256 120 C 200 120 160 150 160 210 C 160 260 180 290 200 340 C 215 375 220 400 235 400 C 248 400 252 360 256 340 C 260 360 264 400 277 400 C 292 400 297 375 312 340 C 332 290 352 260 352 210 C 352 150 312 120 256 120 Z" fill="url(#tooth)" />
    
    <!-- Dental Cross / Sparkle -->
    <path d="M 256 190 L 256 250 M 226 220 L 286 220" stroke="#FF981A" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
